<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ============================================================
   Roster Creator — Redesign Design Tokens
   ============================================================
   brandPrefix: rc
   Direction : Modern professional SaaS workbench
   Primary   : Indigo (professional, trustworthy, energetic)
   Neutrals  : Cool slate with a hint of blue
   Radius    : Generous rounded corners (friendly, approachable)
   Motion    : Subtle, purposeful micro-interactions
   ============================================================ */

:root {
  color-scheme: light;

  /* ============ Brand: Indigo ============ */
  --rc-primary-50: #eef1ff;
  --rc-primary-100: #e0e5ff;
  --rc-primary-200: #c7cdff;
  --rc-primary-300: #a5a9ff;
  --rc-primary-400: #8884fb;
  --rc-primary-500: #6d63f0;
  --rc-primary-600: #5a49e0;
  --rc-primary-700: #4a38c2;
  --rc-primary-800: #3c2f9c;
  --rc-primary-900: #312a78;

  /* ============ Semantic surface (light) ============ */
  --rc-background: #f4f5fb;
  --rc-foreground: #191c2e;
  --rc-card: #ffffff;
  --rc-card-foreground: #191c2e;
  --rc-popover: #ffffff;
  --rc-popover-foreground: #191c2e;
  --rc-muted: #eceef7;
  --rc-muted-foreground: #6a7089;
  --rc-border: #e6e8f2;
  --rc-input: #e0e3f0;
  --rc-ring: #8884fb;
  --rc-primary: #4a38c2;
  --rc-primary-foreground: #ffffff;
  --rc-link: #4a38c2;

  /* ============ Support hues ============ */
  --rc-success: #12b981;
  --rc-success-soft: #e7f8f1;
  --rc-warning: #f59e0b;
  --rc-warning-soft: #fef5e5;
  --rc-danger: #ef4444;
  --rc-danger-soft: #fdeaea;
  --rc-info: #0ea5e9;
  --rc-info-soft: #e7f4fd;

  /* ============ Typography ============ */
  --rc-font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, 'PingFang SC',
    'Microsoft YaHei', sans-serif;
  --rc-font-display: 'Sora', 'Inter', 'Segoe UI', system-ui, -apple-system,
    'PingFang SC', 'Microsoft YaHei', sans-serif;
  --rc-font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;

  /* ============ Radius (generous) ============ */
  --rc-radius-sm: 10px;
  --rc-radius-md: 14px;
  --rc-radius-lg: 20px;
  --rc-radius-xl: 28px;
  --rc-radius-full: 9999px;

  /* ============ Elevation ============ */
  --rc-shadow-sm: 0 1px 2px rgba(16, 18, 44, 0.05);
  --rc-shadow-md: 0 4px 16px -2px rgba(30, 27, 75, 0.08);
  --rc-shadow-lg: 0 16px 40px -12px rgba(30, 27, 75, 0.18);
  --rc-shadow-glow: 0 8px 28px -6px rgba(109, 99, 240, 0.55);

  /* ============ Layout ============ */
  --rc-sidebar-width: 264px;
  --rc-header-height: 72px;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--rc-background);
    --color-foreground: var(--rc-foreground);
    --color-card: var(--rc-card);
    --color-card-foreground: var(--rc-card-foreground);
    --color-popover: var(--rc-popover);
    --color-popover-foreground: var(--rc-popover-foreground);
    --color-primary: var(--rc-primary);
    --color-primary-foreground: var(--rc-primary-foreground);
    --color-muted: var(--rc-muted);
    --color-muted-foreground: var(--rc-muted-foreground);
    --color-border: var(--rc-border);
    --color-input: var(--rc-input);
    --color-ring: var(--rc-ring);
    --radius-sm: var(--rc-radius-sm);
    --radius-md: var(--rc-radius-md);
    --radius-lg: var(--rc-radius-lg);
    --radius-xl: var(--rc-radius-xl);
  }
  @layer base {
    body { background: var(--rc-background); color: var(--rc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">

      .text-card-foreground { color: var(--rc-card-foreground); }
      .border-card-foreground { border-color: var(--rc-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--rc-card-foreground); }
      .bg-popover { background-color: var(--rc-popover); }

      .border-popover { border-color: var(--rc-popover); }

      .bg-popover-foreground { background-color: var(--rc-popover-foreground); }
      .text-popover-foreground { color: var(--rc-popover-foreground); }
      .border-popover-foreground { border-color: var(--rc-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--rc-popover-foreground); }
      .bg-primary { background-color: var(--rc-primary); }
      .text-primary { color: var(--rc-primary); }
      .border-primary { border-color: var(--rc-primary); }
      .ring-primary { --tw-ring-color: var(--rc-primary); }
      .bg-primary-foreground { background-color: var(--rc-primary-foreground); }
      .text-primary-foreground { color: var(--rc-primary-foreground); }
      .border-primary-foreground { border-color: var(--rc-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--rc-primary-foreground); }
      .bg-muted { background-color: var(--rc-muted); }

      .ring-muted-foreground { --tw-ring-color: var(--rc-muted-foreground); }
      .bg-border { background-color: var(--rc-border); }
      .text-border { color: var(--rc-border); }
      .border-border { border-color: var(--rc-border); }
      .ring-border { --tw-ring-color: var(--rc-border); }
      .bg-input { background-color: var(--rc-input); }
      .text-input { color: var(--rc-input); }
      .border-input { border-color: var(--rc-input); }
      .ring-input { --tw-ring-color: var(--rc-input); }
      .bg-ring { background-color: var(--rc-ring); }
      .text-ring { color: var(--rc-ring); }
      .border-ring { border-color: var(--rc-ring); }
      .ring-ring { --tw-ring-color: var(--rc-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
